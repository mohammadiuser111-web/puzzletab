<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:;">
<title>چیدمان پازلی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="canvas">
    <div id="monitors"></div>
    <div id="pill">
      <span class="pillTitle">
        <svg class="ic" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="6.2" height="6.2" rx="1"/><rect x="8.8" y="1" width="6.2" height="4.2" rx="1"/><rect x="8.8" y="6.3" width="6.2" height="8.7" rx="1"/><rect x="1" y="8.3" width="6.2" height="6.7" rx="1"/></g></svg>
        حالت چیدمان — پنجره‌ها را بکش/تغییر اندازه بده
      </span>
      <button id="btnAddMore" class="pillBtn">
        <svg class="ic" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        افزودن پنجره
      </button>
      <button id="btnResetZoom" class="pillBtn">
        <svg class="ic" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="6.8" cy="6.8" r="4.6"/><line x1="10.2" y1="10.2" x2="14.5" y2="14.5" stroke-linecap="round"/><line x1="4.6" y1="6.8" x2="9" y2="6.8" stroke-linecap="round"/></g></svg>
        بازنشانی زوم
      </button>
      <button id="btnDone" class="pillBtn done">
        <svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        پایان (Esc)
      </button>
    </div>
    <div id="empty" hidden>
      <div class="emptyBox">هیچ پنجره‌ای انتخاب نشده. Esc را بزن و دوباره از ترِی «چیدمان پنجره‌های باز» را انتخاب کن.</div>
    </div>
  </div>

  <template id="tplGhost">
    <div class="gtile">
      <div class="ghead">
        <span class="gic"><img hidden></span>
        <span class="gtitle"></span>
        <select class="gref" hidden>
          <option value="1920">۱۹۲۰ (مانیتور بزرگ)</option>
          <option value="1536">۱۵۳۶ (دسکتاپ)</option>
          <option value="1280" selected>۱۲۸۰ (پیش‌فرض)</option>
          <option value="1024">۱۰۲۴ (لپ‌تاپ کوچک)</option>
          <option value="820">۸۲۰ (تبلت)</option>
        </select>
        <div class="gcaps">
          <button class="gcap gmin" title="کوچک کردن (Minimize)"><svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg></button>
          <button class="gcap gmax" title="بزرگ‌نمایی در چیدمان"><svg viewBox="0 0 10 10" class="icoMax"><rect x="0.5" y="0.5" width="9" height="9" /></svg></button>
          <button class="gcap gx" title="حذف از چیدمان (پنجره واقعی بسته نمی‌شود)"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg></button>
        </div>
      </div>
      <div class="gbody">
        <div class="ginfo"></div>
        <div class="gminOverlay" hidden>
          <span>به‌حالت کوچک درآمد — برای بازگردانی کلیک کن</span>
        </div>
      </div>
      <div class="rz n" data-dir="n"></div>
      <div class="rz s" data-dir="s"></div>
      <div class="rz e" data-dir="e"></div>
      <div class="rz w" data-dir="w"></div>
      <div class="rz ne" data-dir="ne"></div>
      <div class="rz nw" data-dir="nw"></div>
      <div class="rz se" data-dir="se"></div>
      <div class="rz sw" data-dir="sw"></div>
    </div>
  </template>

  <script src="overlay.js"></script>
</body>
</html>
