<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:;">
<title>انتخاب پنجره‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="drag">
      <b><svg class="ic" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1" width="6.2" height="6.2" rx="1"/><rect x="8.8" y="1" width="6.2" height="4.2" rx="1"/><rect x="8.8" y="6.3" width="6.2" height="8.7" rx="1"/><rect x="1" y="8.3" width="6.2" height="6.7" rx="1"/></g></svg>چیدمان پنجره‌های باز</b>
      <button id="btnClose" class="x" title="بستن"><svg viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="sub">پنجره‌هایی که می‌خوای مثل پازل بچینی رو انتخاب کن.</div>
    <div class="searchRow">
      <input id="search" class="text" placeholder="جست‌وجو (نام برنامه یا عنوان)…">
      <button id="btnRefresh" class="iconbtn" title="بازخوانی لیست">
        <svg viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 11.8 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.6 1.6v3h-3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="list" class="list">
      <div class="loading">در حال خواندن پنجره‌های باز…</div>
    </div>
    <div class="footer">
      <span id="countLabel" class="count">۰ انتخاب شده</span>
      <div class="footer-btns">
        <button id="btnCancel" class="btn">انصراف</button>
        <button id="btnGo" class="btn primary" disabled>
          ادامه و چیدن
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
<script src="picker.js"></script>
</body>
</html>
